[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termsweeper"
version = "1.0.9"
authors = [
  { name="Mr.Rutrum", email="l35gamershaman@gmail.com" },
]
description = "Just a game-minesweeper on the Linux terminal."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]


[project.scripts]
termsweeper = "termsweeper.main:run"
